<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Audio Downloader 🎵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Microsoft JhengHei', sans-serif;
            background: #ffa726;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 40px 40px;
            animation: moveStars 20s linear infinite;
        }

        @keyframes moveStars {
            0% { background-position: 0 0, 40px 40px; }
            100% { background-position: 50px 50px, 90px 90px; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 750px;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .icon-title {
            font-size: 40px;
            margin-bottom: 5px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #ff6f00;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .url-input {
            width: 100%;
            height: 45px;
            font-size: 15px;
            color: #333;
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 0 18px;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            outline: none;
            border-color: #f7b733;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(247, 183, 51, 0.2);
        }

        .url-preview {
            margin-top: 10px;
            padding: 12px;
            background: #fff9c4;
            border-radius: 12px;
            font-size: 13px;
            color: #2d3436;
            word-wrap: break-word;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(253, 203, 110, 0.3);
            transition: all 0.3s ease;
        }

        .url-preview:empty::before {
            content: '已準備接收 YouTube URL...';
            color: #636e72;
            font-style: italic;
        }

        .download-btn {
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            color: #fff;
            background: #ff6f00;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 111, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(247, 183, 51, 0.6);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .info-box {
            min-height: 150px;
            padding: 20px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 20px;
            color: #2d3436;
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: all 0.3s ease;
            line-height: 1.3;
            text-align: left;
        }

        .info-box.loading {
            background: #e1f5fe;
            border-color: #64b5f6;
            color: #1565c0;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .info-box.success {
            background: #e8f5e9;
            border-color: #66bb6a;
            color: #2e7d32;
            animation: successPop 0.5s ease-out;
        }

        @keyframes successPop {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .info-box.error {
            background: #ffebee;
            border-color: #ef5350;
            color: #c62828;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .info-line {
            display: block;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(247, 183, 51, 0.3);
            border-top-color: #f7b733;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Progress bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: #ff6f00;
            width: 0%;
            transition: width 0.3s ease;
            animation: progressShine 1.5s infinite;
        }

        @keyframes progressShine {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            .title {
                font-size: 22px;
            }

            .icon-title {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon-title">🎵</div>
            <h1 class="title">YouTube 音樂下載器</h1>
            <p class="subtitle">輕鬆下載您喜愛的音樂 • 建議影片長度 ≤ 6 分鐘</p>
        </div>

        <div class="input-group">
            <label class="input-label">
                <span>🔗</span>
                <span>YouTube 網址</span>
            </label>
            <input 
                type="text" 
                id="urlInput" 
                class="url-input" 
                placeholder="貼上 YouTube 影片網址..."
                value="https://www.youtube.com/"
            >
            <div id="urlPreview" class="url-preview"></div>
        </div>

        <button id="downloadBtn" class="download-btn">
            <span>開始下載音樂</span>
        </button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="infoBox" class="info-box">
            <div style="text-align: center; color: #95a5a6;">
                <div style="font-size: 35px; margin-bottom: 4px;">🎼</div>
                <div style="font-size: 15px;">等待下載...</div>
                <div style="font-size: 12px; margin-top: 3px;">下載完成後，資訊將顯示於此</div>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const urlPreview = document.getElementById('urlPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const infoBox = document.getElementById('infoBox');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        // Update URL preview when input changes
        urlInput.addEventListener('input', function() {
            urlPreview.textContent = this.value;
        });

        // Initialize preview
        urlPreview.textContent = urlInput.value;

        // Handle download button click
        downloadBtn.addEventListener('click', async function() {
            const url = urlInput.value.trim();
            
            if (!url || url === 'https://www.youtube.com/') {
                infoBox.className = 'info-box error';
                infoBox.innerHTML = `
                    <div class="info-line">❌ 錯誤：請輸入有效的 YouTube 網址</div>
                `;
                return;
            }

            // Disable button and show loading
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<span class="spinner"></span><span>下載中...</span>';
            
            infoBox.className = 'info-box loading';
            infoBox.innerHTML = `
                <div class="info-line">
                    <span class="spinner"></span>
                    <span>正在連接 YouTube 伺服器...</span>
                </div>
                <div class="info-line">📡 正在獲取影片資訊...</div>
                <div class="info-line">⏳ 請稍候，這可能需要幾秒鐘...</div>
            `;

            // Show progress bar
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url })
                });

                progressBar.style.width = '70%';

                const data = await response.json();

                progressBar.style.width = '100%';

                if (data.success) {
                    infoBox.className = 'info-box success';
                    infoBox.innerHTML = `
                        <div style="text-align: center; font-size: 20px; margin-bottom: 2px;">✅</div>
                        <div class="info-line"><strong>🎵 標題：</strong> ${data.title}</div>
                        <div class="info-line"><strong>⏱️ 長度：</strong> ${data.length}</div>
                        <div class="info-line"><strong>👤 創作者：</strong> ${data.author}</div>
                        <div class="info-line"><strong>📁 檔案名稱：</strong> ${data.filename}</div>
                        <div class="info-line" style="margin-top: 2px; color: #2e7d32; font-weight: bold;">
                            🎉 下載完成！檔案已儲存至 audios 資料夾
                        </div>
                    `;

                    // Confetti effect (text-based)
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        progressBar.style.width = '0%';
                    }, 1000);
                } else {
                    infoBox.className = 'info-box error';
                    infoBox.innerHTML = `
                        <div style="text-align: center; font-size: 25px; margin-bottom: 2px;">⚠️</div>
                        <div class="info-line"><strong>錯誤訊息：</strong></div>
                        <div class="info-line">${data.error}</div>
                        <div class="info-line" style="margin-top: 2px; font-weight: bold;">
                            💡 請檢查網址是否正確，或稍後再試
                        </div>
                    `;
                    progressContainer.style.display = 'none';
                    progressBar.style.width = '0%';
                }
            } catch (error) {
                infoBox.className = 'info-box error';
                infoBox.innerHTML = `
                    <div style="text-align: center; font-size: 25px; margin-bottom: 8px;">🔌</div>
                    <div class="info-line"><strong>網路錯誤：</strong></div>
                    <div class="info-line">${error.message}</div>
                    <div class="info-line" style="margin-top: 8px; font-size: 13px;">
                        💡 請檢查網路連線，或稍後再試
                    </div>
                `;
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
            } finally {
                // Re-enable button
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<span>⬇️</span><span>開始下載音樂</span>';
            }
        });

        // Allow Enter key to trigger download
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                downloadBtn.click();
            }
        });

        // Select all text on focus
        urlInput.addEventListener('focus', function() {
            this.select();
        });
    </script>
</body>
</html>
